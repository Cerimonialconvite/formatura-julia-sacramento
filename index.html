<style>
  :root{ --oliva:#948F58; --vinho:#650E31; --creme:#FDDFDA; --creme-linha:rgba(253,223,218,.45); --luz:#FFF9F5; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--oliva);height:100%;overflow-x:hidden}
  #convite{overflow-x:clip}
  body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--creme);-webkit-tap-highlight-color:transparent}
  .tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a0614;overflow:hidden;z-index:10;transition:opacity .9s ease}
  .tela.oculta{opacity:0;pointer-events:none}
  .quadro{position:relative;height:100%;width:100%;max-width:calc(100vh * 9 / 16);max-height:calc(100vw * 16 / 9)}
  .quadro img,.quadro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .fundo{position:absolute;inset:-80px;background:#2a0614 url(img/poster.jpg) center/cover;filter:blur(30px) brightness(.8)}
  #animacao{background:#2a0614}
  #capa{cursor:pointer}
  #capa .selo{position:absolute;left:51.5%;top:51.7%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
  #capa .selo::before,#capa .selo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(253,223,218,.75);opacity:0;animation:anel 2.4s ease-out infinite}
  #capa .selo::after{animation-delay:1.2s}
  @keyframes anel{0%{opacity:.85;transform:scale(.55)}100%{opacity:0;transform:scale(1.35)}}
  #capa .toque{position:absolute;left:50%;top:83%;background:rgba(60,8,28,.35);backdrop-filter:blur(3px);transform:translate(-50%,-50%);padding:10px 26px;border:1px solid rgba(253,223,218,.55);border-radius:40px;
    font:500 clamp(14px,4vw,18px) "Cormorant Garamond",serif;letter-spacing:.22em;text-transform:uppercase;color:var(--creme);white-space:nowrap;animation:pulso 2.4s ease-in-out infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(253,223,218,0)}50%{box-shadow:0 0 24px 4px rgba(253,223,218,.28)}}
  #pular{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:8px 14px;border:1px solid rgba(253,223,218,.5);border-radius:30px;background:rgba(101,14,49,.55);color:var(--creme);font:500 15px "Cormorant Garamond",serif;letter-spacing:.08em;opacity:0;transition:opacity .6s}
  #animacao.mostra-pular #pular{opacity:1}
  /* clareando: a tela vai ficando branca e o convite nasce da luz */
  #brilho{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#fff 0,var(--luz) 55%,#F6EDE4 100%);opacity:0;pointer-events:none;z-index:20;transition:opacity 1s ease-in}
  #brilho.acende{opacity:1}
  #brilho.apaga{transition:opacity 1.3s ease-out;opacity:0}
  #convite{max-width:540px;margin:0 auto;background:var(--oliva);opacity:0;transition:opacity 1s ease}
  #convite.visivel{opacity:1}
  .faixa{position:relative;width:100%}
  .faixa canvas{display:block;width:100%;height:auto}
  .faixa[data-efeito="fade"] canvas{opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s ease}
  .faixa.visto[data-efeito="fade"] canvas{opacity:1;transform:none}
  .txt{position:absolute;height:auto;pointer-events:none;opacity:0;transform:translateY(14px);filter:blur(5px);transition:opacity .9s ease,transform .9s ease,filter .9s ease}
  .txt.visto{opacity:1;transform:none;filter:none}
  /* áreas clicáveis + dica */
  .faixa:has(.area){z-index:2}
  .area{position:absolute;display:block;border-radius:14px;cursor:pointer;z-index:3;overflow:hidden;--glow:rgba(253,223,218,.45)}
  .area.sobre-claro{--glow:rgba(101,14,49,.6);border-radius:4px}
  .area::before{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:45%;opacity:0;
    background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,252,248,.85) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);mix-blend-mode:screen}
  .faixa.dicas .area::before{opacity:1;animation:reflexo 3.6s ease-in-out .4s infinite}
  @keyframes reflexo{0%{left:-60%}45%,100%{left:130%}}
  @keyframes aura{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 30px 8px var(--glow)}}
  .area:focus-visible{outline:2px solid var(--creme);outline-offset:4px}
  .area::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity 1s}
  .faixa.dicas .area{animation:aura 2.6s ease-in-out infinite}
  .faixa.dicas .area::after{opacity:1;animation:aura 2.6s ease-in-out infinite}
  .area:active{background:rgba(253,223,218,.12)}
  .dica{position:absolute;left:50%;z-index:4;display:flex;max-width:92%;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:40px;white-space:nowrap;text-decoration:none;
    font:600 clamp(13px,3.6vw,15px) "Cormorant Garamond",serif;letter-spacing:.12em;text-transform:uppercase;
    opacity:0;transform:translate(-50%,-50%) translateY(10px);transition:opacity .8s ease,transform .8s ease;box-shadow:0 6px 18px rgba(40,5,20,.25)}
  .dica svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .dica.clara{background:var(--creme);color:var(--vinho)}
  .dica.escura{background:var(--vinho);color:var(--creme)}
  .faixa.dicas .dica{opacity:1;transform:translate(-50%,-50%);animation:chama 2.8s ease-in-out 1s infinite}
  .dica::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1.5px solid currentColor;opacity:0}
  .faixa.dicas .dica::before{animation:onda 2.8s ease-out 1s infinite}
  @keyframes chama{0%,100%{transform:translate(-50%,-50%)}12%{transform:translate(-50%,-50%) scale(1.04)}24%{transform:translate(-50%,-50%)}}
  @keyframes onda{0%{opacity:.7;transform:scale(1)}40%,100%{opacity:0;transform:scale(1.06,1.5)}}
  .contagem{position:relative;aspect-ratio:1080/949;background:var(--vinho);box-shadow:0 1px 0 var(--vinho),0 -1px 0 var(--vinho);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;text-align:center}
  .contagem>*{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s ease}
  .contagem.revelada>*{opacity:1;transform:none}
  .contagem h2{font-family:"Pinyon Script",cursive;font-weight:400;font-size:clamp(46px,13vw,66px);line-height:1}
  .contagem p{margin-top:8px;font-size:clamp(14px,4vw,17px);letter-spacing:.16em;text-transform:uppercase;transition-delay:.15s}
  .relogio{display:flex;justify-content:center;gap:clamp(8px,3vw,16px);margin-top:28px;transition-delay:.3s}
  .unidade{min-width:clamp(60px,18vw,88px);padding:14px 4px 10px;border-top:1px solid var(--creme-linha);border-bottom:1px solid var(--creme-linha)}
  .unidade b{display:block;font-weight:500;font-size:clamp(32px,9.5vw,46px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
  .unidade small{display:block;margin-top:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  .chegou{display:none;margin-top:22px;font-family:"Pinyon Script",cursive;font-size:42px}
  #som{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid rgba(101,14,49,.35);background:rgba(253,223,218,.9);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(60,10,30,.2)}
  #som.ativo{display:flex}
  #som svg{width:22px;height:22px;fill:none;stroke:var(--vinho);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #som .off{display:none} #som.mudo .on{display:none} #som.mudo .off{display:block}
  /* confirmação: painel no formato da tela do celular (9:16), fixo, sem correr para os lados */
  .janela{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:contain;touch-action:none;background:rgba(40,6,20,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s ease}
  .janela.aberta{opacity:1;pointer-events:auto}
  .caixa{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#FBF1EC;overflow:hidden;touch-action:pan-y;transform:translateY(24px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .janela.aberta .caixa{transform:none}
  @media (min-aspect-ratio:10/16){ .caixa{height:94vh;height:94dvh;width:calc(94dvh * 9 / 16);max-width:100vw;border-radius:18px;box-shadow:0 20px 60px rgba(40,0,15,.5)} }
  .caixa-topo{position:relative;z-index:2;flex:none;background:var(--vinho);color:var(--creme);text-align:center;padding:calc(14px + env(safe-area-inset-top)) 56px 12px}
  .caixa-topo .brasao{width:32px;height:auto;display:block;margin:0 auto 6px}
  .caixa-topo h3{font-family:"Pinyon Script",cursive;font-weight:400;font-size:34px;line-height:1.05}
  .caixa-topo p{margin-top:2px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .caixa-topo .fechar{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(253,223,218,.4);background:transparent;color:var(--creme);font-size:22px;line-height:1;cursor:pointer}
  .caixa-corpo{position:relative;flex:1;min-height:0;overflow:hidden;background:#FBF1EC}
  .caixa-corpo iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;transition:opacity .5s}
  .caixa-corpo iframe.pronto{opacity:1}
  .carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--vinho);font-style:italic;font-size:19px}
  .caixa-rodape{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#FBF1EC;border-top:1px solid rgba(101,14,49,.12);text-align:center}
  .voltar{padding:11px 26px;border-radius:40px;border:0;background:var(--vinho);color:var(--creme);font:600 14px "Cormorant Garamond",serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  html.travado,html.travado body{overflow:hidden}
  @media (prefers-reduced-motion: reduce){ .txt{filter:none;transform:none} .faixa.dicas .dica,.faixa.dicas .dica::before,.faixa.dicas .area::after{animation:none} }
</style>
</head>

  var janela=document.getElementById('janela'), jf=document.getElementById('janela-frame'), posRolagem=0;
  jf.addEventListener('load',function(){ if(jf.src && jf.src.indexOf('about:')!==0) jf.classList.add('pronto'); });
  function abrirJanela(){
    if(!jf.getAttribute('src')) jf.src=LINK_CONFIRMACAO+'?embedded=true';
    posRolagem=window.scrollY;
    document.documentElement.classList.add('travado');
    janela.classList.add('aberta');
  }
  function fecharJanela(){
    janela.classList.remove('aberta');
    document.documentElement.classList.remove('travado');
    window.scrollTo(window.scrollX&&0,posRolagem);
  }
  document.getElementById('fechar').addEventListener('click',fecharJanela);
  document.getElementById('voltar').addEventListener('click',fecharJanela);
  janela.addEventListener('click',function(e){ if(e.target===janela) fecharJanela(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') fecharJanela(); });
  document.querySelectorAll('.rsvp-link').forEach(function(a){
    a.href=LINK_CONFIRMACAO; a.removeAttribute('target');
    a.addEventListener('click',function(e){ e.preventDefault(); abrirJanela(); });
  });

  /* música: começa no toque da capa */
  var semMusica=false;
  musica.addEventListener('error',function(){ semMusica=true; som.classList.remove('ativo'); });
  function fadeIn(){ musica.volume=0; var v=0; var t=setInterval(function(){ v+=0.05; musica.volume=Math.min(v,0.85); if(v>=0.85) clearInterval(t); },150); }
  function tocar(){
    if(semMusica||musica.error) return;
    var p=musica.play();
    if(p&&p.then) p.then(function(){ som.classList.add('ativo'); fadeIn(); }).catch(function(){ if(!musica.error) som.classList.add('ativo','mudo'); });
    else som.classList.add('ativo');
  }
  var pausadoPeloUsuario=false, saiuPorLink=false;
  som.addEventListener('click',function(){
    if(musica.paused){ pausadoPeloUsuario=false; musica.play(); som.classList.remove('mudo'); som.setAttribute('aria-label','Pausar música'); }
    else { pausadoPeloUsuario=true; musica.pause(); som.classList.add('mudo'); som.setAttribute('aria-label','Tocar música'); }
  });
  /* mapa: abre no app; a música continua e, se o celular pausar, volta sozinha ao retornar */
  document.querySelectorAll('a[href*="google.com/maps"]').forEach(function(p){ p.addEventListener('click',function(){ saiuPorLink=true; }); });
  function retomar(){
    if(semMusica||!aberto||pausadoPeloUsuario||!musica.paused) return;
    var p=musica.play();
    if(p&&p.catch) p.catch(function(){
      var umToque=function(){ document.removeEventListener('pointerdown',umToque,true); if(!pausadoPeloUsuario) musica.play(); };
      document.addEventListener('pointerdown',umToque,true);
    });
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ if(!saiuPorLink && !musica.paused) musica.pause(); }
    else { saiuPorLink=false; retomar(); }
  });
  window.addEventListener('pageshow',retomar);
  window.addEventListener('focus',function(){ saiuPorLink=false; retomar(); });

  /* abertura: capa -> vídeo -> clareando -> convite */
  function abrir(){
    if(aberto) return; aberto=true;
    tocar();
    anim.classList.remove('oculta'); capa.classList.add('oculta');
    var p=video.play(); if(p&&p.catch) p.catch(function(){ clarear(); });
    setTimeout(function(){ anim.classList.add('mostra-pular'); },1200);
    setTimeout(clarear,10000); // segurança
  }
  // começa a clarear um pouco antes do fim, quando o cartão branco sobe
  video.addEventListener('timeupdate',function(){ if(video.duration && video.currentTime>=video.duration-1.0) clarear(); });
  video.addEventListener('ended',clarear);
  document.getElementById('pular').addEventListener('click',clarear);
  function clarear(){
    if(terminou) return; terminou=true;
    brilho.classList.add('acende');
    setTimeout(function(){
      convite.hidden=false; window.scrollTo(0,0);
      anim.classList.add('oculta'); try{ video.pause(); }catch(e){}
      capa.remove();
      requestAnimationFrame(function(){
        convite.classList.add('visivel');
        brilho.classList.add('apaga');
        setTimeout(iniciarEntrada,350);
      });
      setTimeout(function(){ anim.remove(); brilho.remove(); },1600);
    },1050);
  }
  capa.addEventListener('click',abrir);
  capa.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } });

  /* ---------- faixas ---------- */
  var imagens={}, LARG=1080;
  function carregar(src){ if(!imagens[src]){ imagens[src]=new Promise(function(ok){ var i=new Image(); i.onload=function(){ ok(i); }; i.src=src; }); } return imagens[src]; }
  var faixas=[].slice.call(document.querySelectorAll('.faixa'));
  faixas.forEach(function(f){
    var h=+f.dataset.h, c=document.createElement('canvas');
    c.width=LARG; c.height=h; f.style.aspectRatio=LARG+' / '+h;
    f.insertBefore(c,f.firstChild); f._canvas=c;
    if(f.dataset.efeito!=='aquarela') desenhaInteira(f); else carregar(f.dataset.img);
  });
  function desenhaInteira(f){
    return carregar(f.dataset.img).then(function(img){
      var c=f._canvas, ctx=c.getContext('2d');
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
      ctx.clearRect(0,0,c.width,c.height); ctx.drawImage(img,0,+f.dataset.y,c.width,c.height,0,0,c.width,c.height);
    });
  }

  /* aquarela pincelada (orquídeas, envelopes, molduras) */
  function pintarAquarela(f){
    return carregar(f.dataset.img).then(function(img){ return new Promise(function(pronto){
      var c=f._canvas, ctx=c.getContext('2d'), W=c.width, H=c.height, y0=+f.dataset.y;
      var m=document.createElement('canvas'); m.width=W; m.height=H; var mc=m.getContext('2d');
      var nf=Math.max(2,Math.ceil(H/170)), pinc=[], DUR=1050, ATRASO=120;
      for(var i=0;i<nf;i++){ pinc.push({ y:(i+0.5)*H/nf, esq:i%2===0, ini:i*ATRASO, ultimo:-1, onda:Math.random()*6, amp:18+Math.random()*22, r:H/nf*0.95+34 }); }
      var total=(nf-1)*ATRASO+DUR, t0=null, avisou=false;
      function borrao(x,y,r){
        for(var k=0;k<3;k++){
          var rx=x+(Math.random()-.5)*r*.7, ry=y+(Math.random()-.5)*r*.6, rr=r*(.55+Math.random()*.6);
          var g=mc.createRadialGradient(rx,ry,rr*.15,rx,ry,rr);
          g.addColorStop(0,'rgba(0,0,0,.6)'); g.addColorStop(.6,'rgba(0,0,0,.3)'); g.addColorStop(1,'rgba(0,0,0,0)');
          mc.fillStyle=g; mc.beginPath(); mc.arc(rx,ry,rr,0,6.283); mc.fill();
        }
      }
      function quadro(t){
        if(t0===null) t0=t; var dt=t-t0;
        pinc.forEach(function(p){
          var prog=Math.min(1,Math.max(0,(dt-p.ini)/DUR)); if(prog<=0) return;
          prog=1-Math.pow(1-prog,2.2); var alvo=Math.floor(prog*34);
          for(var s=p.ultimo+1;s<=alvo;s++){ var u=s/34, x=-120+u*(W+240); if(!p.esq) x=W-x; borrao(x,p.y+Math.sin(u*5+p.onda)*p.amp,p.r); }
          p.ultimo=alvo;
        });
        if(!avisou && dt>total*0.55){ avisou=true; pronto(); }
        var fim=Math.min(1,Math.max(0,(dt-total+250)/550));
        ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,W,H);
        ctx.drawImage(img,0,y0,W,H,0,0,W,H);
        ctx.globalCompositeOperation='destination-in'; ctx.drawImage(m,0,0);
        if(fim>0){ ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=fim; ctx.drawImage(img,0,y0,W,H,0,0,W,H); ctx.globalAlpha=1; }
        if(fim<1) requestAnimationFrame(quadro); else desenhaInteira(f);
      }
      requestAnimationFrame(quadro);
    }); });
  }

  function textos(f,inicio){
    var tx=f.querySelectorAll('.txt'), passo=260;
    tx.forEach(function(t,i){ setTimeout(function(){ t.classList.add('visto'); },inicio+i*passo); });
    if(f.querySelector('.area')) setTimeout(function(){ f.classList.add('dicas'); },inicio+tx.length*passo+300);
  }
  function revelar(f){
    if(f._feito) return; f._feito=true;
    var ef=f.dataset.efeito;
    if(semMovimento){ desenhaInteira(f); f.classList.add('visto'); textos(f,0); return; }
    if(ef==='aquarela'){ pintarAquarela(f).then(function(){ textos(f,0); }); return; }
    if(ef==='fade'){ f.classList.add('visto'); textos(f,350); return; }
    textos(f,100);
  }
  function iniciarEntrada(){
    var cont=document.querySelector('.contagem');
    if(!('IntersectionObserver' in window)){ faixas.forEach(revelar); cont.classList.add('revelada'); return; }
    var obs=new IntersectionObserver(function(es){ es.forEach(function(e){
      if(!e.isIntersecting) return;
      if(e.target===cont) cont.classList.add('revelada'); else revelar(e.target);
      obs.unobserve(e.target);
    }); },{threshold:0.22});
    faixas.forEach(function(f){ obs.observe(f); }); obs.observe(cont);
  }

  /* contagem regressiva */
  var rel=document.getElementById('relogio');
  var alvo=new Date('2027-01-15T21:00:00-03:00').getTime();
  var dois=function(n){ return (n<10?'0':'')+n; };
  (function atualiza(){
    var r=alvo-Date.now();
    if(r<=0){ rel.style.display='none'; document.getElementById('chegou').style.display='block'; return; }
    var s=Math.floor(r/1000);
    document.getElementById('d').textContent=Math.floor(s/86400);
    document.getElementById('h').textContent=dois(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=dois(Math.floor(s%3600/60));
    document.getElementById('s').textContent=dois(s%60);
    setTimeout(atualiza,1000);
  })();
})();
</script>
</body>
